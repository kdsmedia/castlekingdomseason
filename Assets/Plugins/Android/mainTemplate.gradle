// GENERATED BY UNITY. REMOVE THIS COMMENT TO PREVENT OVERWRITING WHEN EXPORTING AGAIN

**APPLY_PLUGINS**

apply plugin: 'com.android.library'

dependencies {
    // unity-classes.jar and any other plugin jars Unity places in unityLibrary/libs
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    // Unity Ads native SDK, matching the C# API in Assets/UnityAds
    implementation 'com.unity3d.ads:unity-ads:4.12.1'

    **DEPS**
}

android {
    ndkPath "**NDKPATH**"

    compileSdkVersion **APIVERSION**
    buildToolsVersion '**BUILDTOOLS**'

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    defaultConfig {
        minSdkVersion **MINSDKVERSION**
        targetSdkVersion **TARGETSDKVERSION**
        versionCode **VERSIONCODE**
        versionName '**VERSIONNAME**'

        ndk {
            abiFilters **ABIFILTERS**
        }

        consumerProguardFiles 'proguard-unity.txt'**USER_PROGUARD**
    }

    lintOptions {
        abortOnError false
    }

    aaptOptions {
        noCompress = ['.unity3d', '.ress', '.resource', '.obb'] + unityStreamingAssets.tokenize(', ')
        ignoreAssetsPattern = "!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~"
    }

    // Keep first matching META-INF resources and drop transitive metadata that
    // conflicts when several AARs ship the same files.
    packagingOptions {
        pickFirst 'META-INF/**'
        exclude 'META-INF/DEPENDENCIES'
        exclude 'META-INF/LICENSE'
        exclude 'META-INF/LICENSE.txt'
        exclude 'META-INF/NOTICE'
        exclude 'META-INF/NOTICE.txt'
    }

    buildTypes {
        debug {
            minifyEnabled **MINIFY_DEBUG**
            proguardFiles getDefaultProguardFile('proguard-android.txt')
        }

        release {
            minifyEnabled **MINIFY_RELEASE**
            proguardFiles getDefaultProguardFile('proguard-android.txt')
        }
    }

    **PACKAGING_OPTIONS**
    **SPLITS**
    **EXTERNAL_SOURCES**
}
