// GENERATED BY UNITY. REMOVE THIS COMMENT TO PREVENT OVERWRITING WHEN EXPORTING AGAIN

**APPLY_PLUGINS**

apply plugin: 'com.android.library'

def libsJars = fileTree(dir: 'libs', include: ['*.jar']).matching {
    // Exclude the old unity-plugin-library.jar to avoid duplicate class conflicts with
    // com.google.android.gms:play-services-ads dependency included below.
    exclude 'unity-plugin-library.jar'
}

// Force specific dependency versions and avoid transitive duplicate-class conflicts
configurations.all {
    resolutionStrategy {
        // Force the same version of play-services-ads to prevent mixed-version issues
        force 'com.google.android.gms:play-services-ads:23.2.0'
    }
}

dependencies {
    // include all jars in libs except the excluded ones
    implementation libsJars

    // Google Mobile Ads
    implementation 'com.google.android.gms:play-services-ads:23.2.0'

    // Unity Ads
    implementation 'com.unity3d.ads:unity-ads:4.12.1'

    **DEPS**
}

android {
    namespace "**APPLICATIONID**"

    compileSdkVersion **APIVERSION**
    buildToolsVersion "**BUILDTOOLS**"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    defaultConfig {
        minSdkVersion **MINSDKVERSION**
        targetSdkVersion **TARGETSDKVERSION**
        versionCode **VERSIONCODE**
        versionName "**VERSIONNAME**"

        ndk {
            abiFilters **ABIFILTERS**
        }

        consumerProguardFiles 'proguard-unity.txt' **USER_PROGUARD**
    }

    lintOptions {
        abortOnError false
    }

    aaptOptions {
        noCompress = ['.unity3d', '.ress', '.resource', '.obb'] + unityStreamingAssets.tokenize(', ')
        ignoreAssetsPattern = "!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~"
    }

    // Packaging options to reduce duplicate META-INF and transitive metadata conflicts
    packagingOptions {
        // Keep first matching META-INF resources (helps when multiple AARs include similar files)
        pickFirst 'META-INF/**'
        // Exclude some common transitive metadata files that can cause merge warnings
        exclude 'META-INF/DEPENDENCIES'
        exclude 'META-INF/LICENSE'
        exclude 'META-INF/LICENSE.txt'
        exclude 'META-INF/NOTICE'
        exclude 'META-INF/NOTICE.txt'
    }

    **PACKAGING_OPTIONS**

    buildTypes {
        debug {
            minifyEnabled **MINIFY_DEBUG**
            useProguard **PROGUARD_DEBUG**
            proguardFiles getDefaultProguardFile('proguard-android.txt') **SIGNCONFIG**
        }

        release {
            minSdkVersion **MINSDKVERSION**
            minifyEnabled **MINIFY_RELEASE**
            useProguard **PROGUARD_RELEASE**
            proguardFiles getDefaultProguardFile('proguard-android.txt') **SIGNCONFIG**
        }
    }

    **SIGN**

    **SPLITS**
    **EXTERNAL_SOURCES**
}
